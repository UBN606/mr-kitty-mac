name: Build and check Mr Kitty

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Compile universal app and verify bundle
        run: bash build-mac.sh "$RUNNER_TEMP/kitty-dist"
      - name: Run Mac app smoke test
        run: '"$RUNNER_TEMP/kitty-dist/Mr Kitty.app/Contents/MacOS/MrKitty" --self-test'
      - name: Package Mac app
        run: |
          mkdir -p "$RUNNER_TEMP/kitty-delivery"
          cp -R "$RUNNER_TEMP/kitty-dist/Mr Kitty.app" "$RUNNER_TEMP/kitty-delivery/"
          cp MOM-READ-ME-FIRST.txt "$RUNNER_TEMP/kitty-delivery/"
          ditto -c -k "$RUNNER_TEMP/kitty-delivery" "$RUNNER_TEMP/Mr-Kitty-for-Mac.app.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: Mr-Kitty-for-Mac
          path: ${{ runner.temp }}/Mr-Kitty-for-Mac.app.zip
          if-no-files-found: error

  windows_shared_checks:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Test Codex and Claude chat routing without model calls
        run: python -m unittest discover -s windows/shared/tests -v
      - name: Load Windows controller controls
        shell: pwsh
        run: |
          foreach ($path in @('windows/shared/Mr-Kitty-Controller.ps1', 'windows/shared/Start-Mr-Kitty-Shared.ps1', 'windows/shared/Setup-Mr-Kitty-Voice.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path).Path, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { throw "PowerShell parse errors in $path`: $($errors -join '; ')" }
          }
          & powershell.exe -NoProfile -Sta -ExecutionPolicy Bypass -File 'windows/shared/Mr-Kitty-Controller.ps1' -UiSmokeTest
          if ($LASTEXITCODE -ne 0) { throw 'Kitty controls did not load' }
          & powershell.exe -NoProfile -Sta -ExecutionPolicy Bypass -File 'windows/shared/Mr-Kitty-Controller.ps1' -ReplySmokeTest
          if ($LASTEXITCODE -ne 0) { throw 'Kitty reply card did not open' }
          & powershell.exe -NoProfile -Sta -ExecutionPolicy Bypass -File 'windows/shared/Mr-Kitty-Controller.ps1' -RuntimeSmokeTest
          if ($LASTEXITCODE -ne 0) { throw 'Kitty controller could not start and stop cleanly' }
          if (Test-Path 'windows/shared/runtime/desktop-reply-capture.flag') { throw 'Kitty reply capture flag was left behind' }
      - name: Package one shared Windows Kitty
        run: python windows/build-shared-package.py
      - uses: actions/upload-artifact@v4
        with:
          name: Mr-Kitty-Windows-Shared
          path: dist/Mr-Kitty-Windows-Shared-Codex-Claude.zip
          if-no-files-found: error
